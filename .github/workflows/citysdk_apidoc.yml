name: Update CitySDK API documentation

on: [pull_request]

jobs:
  update-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Prepare Config
        run: |
          rm config/database.yml
          cp config/database.sample.yml config/database.yml
          rm config/secrets.yml
          cp config/secrets.sample.yml config/secrets.yml
          rm config/storage.yml
          cp config/storage.sample.yml config/storage.yml

      - name: Create CitySDK API documentation
        run: bundle exec rails citysdk:apidoc

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Update CitySDK API documentation
          file_pattern: CitySDK_API.md
