# This workflow integrates GitHub CodeQL with GitHub's Code Scanning feature
# CodeQL analyses the Ruby on Rails backend, the JavaScript assets and the
# GitHub Actions workflows of this repository

name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '43 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read # required for workflow runs in private repositories
      contents: read # for actions/checkout to fetch code
      packages: read # for fetching CodeQL packs
      security-events: write # for github/codeql-action/analyze to upload SARIF results

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ruby
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended
        config: |
          paths-ignore:
            - node_modules
            - vendor
            - tmp
            - log
            - storage
            - public/assets
            - app/assets/builds

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.1
      with:
        category: "/language:${{ matrix.language }}"
