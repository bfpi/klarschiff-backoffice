[hooks]
postinstall = [
  'npx corepack enable',
  "npx corepack prepare $(node -p \"require('./package.json').packageManager\")"
]

[env]
DB_PORT = 5435
RAILS_ENV = "development"
SOLID_QUEUE_IN_PUMA = true
# Ruby version for docker compose build (Dockerfile ARG RUBY_VERSION)
RUBY_VERSION = "{{ exec(command=\"sed -E 's/^ruby-//' \" ~ config_root ~ \"/.ruby-version\") }}"
#_.path = "{{config_root}}/bin"
