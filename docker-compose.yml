services:
  database:
    image: postgis/postgis:12-3.5-alpine
    pull_policy: weekly
    container_name: klarschiff-database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: --locale=de_DE.UTF-8
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db:/db

  web:
    container_name: klarschiff-backoffice
    image: ghcr.io/bfpi/klarschiff/backoffice:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GITHUB_BRANCH=${GITHUB_BRANCH:-unknown}
        - GITHUB_COMMIT_HASH=${GITHUB_COMMIT_HASH:-unknown}
    depends_on:
      - database
    environment:
      DB_HOST: database
      INTERCEPT_ALL_MAILS: false
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_RELATIVE_URL_ROOT: ${RAILS_RELATIVE_URL_ROOT:-/}
      RAILS_SERVE_STATIC_FILES: true
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-$(pwgen 64 1)}
      SOLID_QUEUE_IN_PUMA: true
      TZ: Europe/Berlin
    ports:
      - ${BACKOFFICE_PORT:-3001}:3001
      - 3001:3001
    restart: always
    healthcheck:
      retries: 5
      start_interval: 1s
      start_period: 5s
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/backoffice']
      timeout: 5s
    volumes:
      - ./overlay:/rails/overlay
      - ./storage:/rails/storage

networks:
  default:
    name: klarschiff
